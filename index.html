<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة الحسابات السحابي | Cloud Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- استدعاء مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --primary-blue: #0f172a;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --light-blue: #f0f9ff;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --warning-bg: #fef3c7;
            --warning: #d97706;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
        }

        @media (min-width: 768px) {
            .container {
                padding: 32px;
            }
        }

        /* شاشة تسجيل الدخول الرسمية */
        .login-box {
            max-width: 380px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 10px;
        }

        .system-icon {
            width: 70px;
            height: 70px;
            background: var(--light-blue);
            color: var(--accent-blue);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
        }

        .login-box h2 {
            text-align: center;
            font-size: 21px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .login-box .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12.5px; margin-bottom: 6px; font-weight: 700; color: var(--text-dark); }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-dark);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-blue);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background: var(--accent-blue); color: #ffffff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-outline { background: var(--light-blue); color: var(--accent-blue); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #e0f2fe; }

        .btn-warning { background: var(--warning-bg); color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: #ffffff; }

        .btn-danger { background: var(--danger-bg); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #ffffff; }

        .btn-sm { padding: 7px 12px; font-size: 12px; width: auto; border-radius: 8px; }

        /* الهيدر العلوي للوحة التحكم */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .top-bar-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .status-badge {
            background: #dcfce7;
            color: var(--success);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* كارد الإضافة والتفاعل */
        .panel-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 12px; }

        @media (min-width: 640px) {
            .grid-2 { grid-template-columns: 1fr 1fr; }
        }

        /* الجدول وعرض البيانات */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            -webkit-overflow-scrolling: touch;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            background: #ffffff;
            white-space: nowrap;
        }

        .data-table th {
            background: #f1f5f9;
            color: var(--text-dark);
            font-weight: 800;
            text-align: right;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 12px 16px;
            border-top: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        .pass-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .pass-badge {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-blue);
            font-weight: 700;
            direction: ltr;
            font-size: 13px;
        }

        .btn-copy-pass {
            background: transparent;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
            transition: transform 0.1s;
        }
        .btn-copy-pass:active { transform: scale(0.9); }

        /* تصميم عناصر الآدمن والتوسيع */
        .member-block {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            background: #f8fafc;
            cursor: pointer;
            user-select: none;
        }

        .member-header:hover { background: #f1f5f9; }

        .chevron-icon {
            color: var(--accent-blue);
            font-size: 13px;
            transition: transform 0.25s ease;
        }

        .chevron-icon.rotated { transform: rotate(-180deg); }

        .member-body {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background: #ffffff;
        }

        .count-pill {
            background: var(--light-blue);
            color: var(--accent-blue);
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شاشة تسجيل الدخول -->
        <div id="loginSection" class="login-box">
            <div class="system-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>نظام إدارة الحسابات</h2>
            <p class="subtitle">بوابة الدخول الآمن والمزامنة السحابية الفورية</p>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary" onclick="login()" style="margin-top: 8px;">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
            </button>
        </div>

        <!-- لوحة المستخدم الرسمية والأنيقة -->
        <div id="userDashboard" class="hidden">
            <div class="top-bar">
                <div>
                    <span class="status-badge"><i class="fa-solid fa-circle-check"></i> متصل بالسحابة</span>
                    <h3 style="margin-top: 6px; font-size: 19px; font-weight: 800;" id="welcomeUserTitle">أهلاً بك</h3>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-outline btn-sm" onclick="refreshUserDataManual()">
                        <i class="fa-solid fa-rotate"></i> تحديث
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="changeMyPassword()">
                        <i class="fa-solid fa-key"></i> كلمة المرور
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i> خروج
                    </button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title"><i class="fa-solid fa-circle-plus"></i> إضافة حساب أو تطبيق جديد</div>
                <div class="grid-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم التطبيق أو المنصة</label>
                        <input type="text" id="appName" placeholder="مثال: واتساب، فيسبوك...">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>كلمة السر</label>
                        <input type="text" id="appPass" placeholder="كلمة السر الخاصة به">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addUserEntry()" style="margin-top: 14px;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> حفظ سحابي فوري
                </button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h4 style="font-size: 14.5px; font-weight: 800; color: var(--text-dark);"><i class="fa-solid fa-vault" style="color: var(--accent-blue);"></i> خريطة حساباتك المسجلة:</h4>
            </div>
            
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>التطبيق / المنصة</th>
                            <th>كلمة السر</th>
                            <th>تاريخ الإضافة</th>
                            <th style="text-align: center;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="userEntriesTable"></tbody>
                </table>
            </div>
        </div>

        <!-- لوحة المشرف -->
        <div id="adminDashboard" class="hidden">
            <div class="top-bar">
                <div>
                    <span class="status-badge" style="background: #e0f2fe; color: var(--accent-blue);"><i class="fa-solid fa-crown"></i> المشرف العام</span>
                    <h3 style="margin-top: 6px; font-size: 19px; font-weight: 800;">لوحة تحكم الآدمن</h3>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-outline btn-sm" onclick="renderAdminView()">
                        <i class="fa-solid fa-rotate"></i> تحديث
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="changeAdminPassword()">
                        <i class="fa-solid fa-key"></i> كلمة المرور
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="fa-solid fa-power-off"></i> خروج
                    </button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title"><i class="fa-solid fa-user-plus"></i> إضافة مستخدم جديد للنظام</div>
                <div class="grid-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم المستخدم</label>
                        <input type="text" id="newMemberUser" placeholder="مثال: يوسف">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>كلمة المرور</label>
                        <input type="text" id="newMemberPass" placeholder="مثال: 2026">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="adminCreateMember()" style="margin-top: 14px;">
                    <i class="fa-solid fa-check"></i> حفظ المستخدم سحابياً
                </button>
            </div>

            <h4 style="font-size: 14.5px; font-weight: 800; margin-bottom: 10px;"><i class="fa-solid fa-users"></i> المستخدمون المسجلون (<span id="membersCount">0</span>):</h4>
            <div id="adminAllDataContainer"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3dZmGf-HiIleBURpFj-kpssabUuOpRD4",
            authDomain: "familyvault-8246c.firebaseapp.com",
            projectId: "familyvault-8246c",
            storageBucket: "familyvault-8246c.firebasestorage.app",
            messagingSenderId: "175087357500",
            appId: "1:175087357500:web:05c7cbc434c86b2c04fd39",
            measurementId: "G-XN5SPDD0SX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const ADMIN_USER = "hatem";
        let currentUser = null;
        let currentMemberDocId = null;
        let autoSyncInterval = null;
        let expandedMembers = new Set();

        function toggleView(viewId) {
            ['loginSection', 'userDashboard', 'adminDashboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function getAdminPass() {
            const doc = await db.collection('settings').doc('admin').get();
            if (doc.exists) {
                return doc.data().password;
            } else {
                await db.collection('settings').doc('admin').set({ password: "12345" });
                return "12345";
            }
        }

        async function login() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            if (!u || !p) {
                alert('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            const adminPass = await getAdminPass();
            if (u === ADMIN_USER && p === adminPass) {
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                renderAdminView();
                toggleView('adminDashboard');
                startAutoSync('admin');
                return;
            }

            const snapshot = await db.collection('members').where('username', '==', u).where('password', '==', p).get();
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                currentUser = u;
                currentMemberDocId = doc.id;
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('welcomeUserTitle').innerText = `أهلاً بك، ${u}`;
                renderUserEntries(doc.data().entries || []);
                toggleView('userDashboard');
                startAutoSync('user');
            } else {
                alert('خطأ في اسم المستخدم أو كلمة المرور!');
            }
        }

        function startAutoSync(role) {
            if (autoSyncInterval) clearInterval(autoSyncInterval);
            autoSyncInterval = setInterval(async () => {
                if (role === 'user' && currentMemberDocId) {
                    const doc = await db.collection('members').doc(currentMemberDocId).get();
                    if (doc.exists) {
                        renderUserEntries(doc.data().entries || []);
                    }
                } else if (role === 'admin') {
                    renderAdminView();
                }
            }, 5000);
        }

        async function refreshUserDataManual() {
            if (!currentMemberDocId) return;
            const doc = await db.collection('members').doc(currentMemberDocId).get();
            if (doc.exists) {
                renderUserEntries(doc.data().entries || []);
            }
        }

        async function changeMyPassword() {
            const currentPass = prompt('أدخل كلمة المرور الحالية لحسابك:');
            if (currentPass === null) return;
            
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            if (!doc.exists) return;

            if (doc.data().password !== currentPass) {
                alert('كلمة المرور الحالية غير صحيحة!');
                return;
            }

            const newPass = prompt('أدخل كلمة المرور الجديدة:');
            if (!newPass || !newPass.trim()) return;

            await memberRef.update({ password: newPass.trim() });
            alert('تم تغيير كلمة المرور وحفظها في السحابة بنجاح!');
        }

        async function changeAdminPassword() {
            const oldPass = prompt('أدخل كلمة مرور المشرف الحالية:');
            if (oldPass === null) return;
            const adminPass = await getAdminPass();
            if (oldPass !== adminPass) {
                alert('كلمة المرور الحالية غير صحيحة!');
                return;
            }
            const newPass = prompt('أدخل كلمة مرور المشرف الجديدة:');
            if (!newPass || !newPass.trim()) return;

            await db.collection('settings').doc('admin').set({ password: newPass.trim() });
            alert('تم تغيير كلمة مرور المشرف بنجاح!');
        }

        async function addUserEntry() {
            const app = document.getElementById('appName').value.trim();
            const pass = document.getElementById('appPass').value.trim();

            if (!app || !pass) {
                alert('يرجى تعبئة حقل اسم التطبيق وكلمة السر');
                return;
            }

            const now = new Date();
            const date = now.toISOString().split('T')[0];

            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            entries.push({ app, pass, date });

            await memberRef.update({ entries });
            document.getElementById('appName').value = '';
            document.getElementById('appPass').value = '';
            renderUserEntries(entries);
        }

        function renderUserEntries(entries) {
            const tbody = document.getElementById('userEntriesTable');
            tbody.innerHTML = '';
            if (entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 24px;">لا توجد حسابات محفوظة حالياً. ابدأ بإضافة تطبيقك الأول!</td></tr>';
                return;
            }
            entries.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color: var(--text-dark);">${item.app}</strong></td>
                        <td>
                            <div class="pass-container">
                                <span class="pass-badge">${item.pass}</span>
                                <button class="btn-copy-pass" onclick="copyPassword('${item.pass}')" title="نسخ كلمة السر"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </td>
                        <td style="color: var(--text-muted); font-size: 12.5px;">${item.date}</td>
                        <td style="text-align: center;">
                            <div style="display: inline-flex; gap: 6px;">
                                <button class="btn btn-warning btn-sm" onclick="editUserEntry(${index})" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUserEntry(${index})" title="حذف"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        async function editUserEntry(index) {
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            const item = entries[index];

            const newPass = prompt(`تعديل كلمة السر لـ (${item.app}):`, item.pass);
            if (newPass === null) return;

            if (!newPass.trim()) {
                alert('لا يمكن أن تكون كلمة السر فارغة!');
                return;
            }

            const now = new Date();
            entries[index].pass = newPass.trim();
            entries[index].date = now.toISOString().split('T')[0];

            await memberRef.update({ entries });
            renderUserEntries(entries);
        }

        async function deleteUserEntry(index) {
            if (!confirm('هل أنت متأكد من حذف هذا الحساب؟')) return;
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            entries.splice(index, 1);
            await memberRef.update({ entries });
            renderUserEntries(entries);
        }

        async function adminCreateMember() {
            const username = document.getElementById('newMemberUser').value.trim();
            const password = document.getElementById('newMemberPass').value.trim();

            if (!username || !password) {
                alert('أدخل اسم المستخدم وكلمة المرور');
                return;
            }

            await db.collection('members').add({
                username,
                password,
                entries: []
            });

            document.getElementById('newMemberUser').value = '';
            document.getElementById('newMemberPass').value = '';
            renderAdminView();
        }

        function toggleMemberAccordion(mId) {
            const body = document.getElementById(`accordion-body-${mId}`);
            const icon = document.getElementById(`accordion-icon-${mId}`);
            if (!body || !icon) return;

            if (expandedMembers.has(mId)) {
                expandedMembers.delete(mId);
                body.classList.add('hidden');
                icon.classList.remove('rotated');
            } else {
                expandedMembers.add(mId);
                body.classList.remove('hidden');
                icon.classList.add('rotated');
            }
        }

        async function renderAdminView() {
            const snapshot = await db.collection('members').get();
            document.getElementById('membersCount').innerText = snapshot.size;
            const container = document.getElementById('adminAllDataContainer');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:16px;">لا يوجد مستخدمون مسجلون.</p>';
                return;
            }

            snapshot.forEach(docSnap => {
                const member = docSnap.data();
                const mId = docSnap.id;
                const isExpanded = expandedMembers.has(mId);
                const appCount = member.entries ? member.entries.length : 0;
                let entriesHtml = '';
                
                if (appCount === 0) {
                    entriesHtml = '<p style="font-size: 13px; color: var(--text-muted); padding: 8px 0;">لا توجد تطبيقات مضافة لهذا المستخدم.</p>';
                } else {
                    entriesHtml = `<div class="table-wrapper"><table class="data-table"><thead><tr><th>التطبيق</th><th>كلمة السر</th><th>التاريخ</th><th>إجراءات المشرف</th></tr></thead><tbody>`;
                    member.entries.forEach((ent, entIndex) => {
                        entriesHtml += `
                            <tr>
                                <td><strong>${ent.app}</strong></td>
                                <td>
                                    <div class="pass-container">
                                        <span class="pass-badge">${ent.pass}</span>
                                        <button class="btn-copy-pass" onclick="copyPassword('${ent.pass}')"><i class="fa-solid fa-copy"></i></button>
                                    </div>
                                </td>
                                <td>${ent.date}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="adminEditAppPassword('${mId}', ${entIndex}, '${ent.app}', '${ent.pass}')">تعديل الباسورد</button>
                                </td>
                            </tr>
                        `;
                    });
                    entriesHtml += `</tbody></table></div>`;
                }

                container.innerHTML += `
                    <div class="member-block">
                        <div class="member-header" onclick="toggleMemberAccordion('${mId}')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i id="accordion-icon-${mId}" class="fa-solid fa-chevron-down chevron-icon ${isExpanded ? 'rotated' : ''}"></i>
                                <strong style="color: var(--accent-blue); font-size: 15px;">${member.username}</strong>
                                <span style="font-size: 12.5px; color: var(--text-muted);">كلمة المرور: <span class="pass-badge">${member.password}</span></span>
                                <span class="count-pill">${appCount} تطبيق</span>
                            </div>
                            <div style="display: flex; gap: 6px;" onclick="event.stopPropagation()">
                                <button class="btn btn-warning btn-sm" onclick="adminEditMemberPassword('${mId}', '${member.username}', '${member.password}')">تعديل كلمة الحساب</button>
                                <button class="btn btn-danger btn-sm" onclick="adminDeleteMember('${mId}')">حذف</button>
                            </div>
                        </div>
                        <div id="accordion-body-${mId}" class="member-body ${isExpanded ? '' : 'hidden'}">
                            ${entriesHtml}
                        </div>
                    </div>
                `;
            });
        }

        async function adminEditAppPassword(mId, entIndex, appName, currentPass) {
            const newPass = prompt(`تعديل كلمة السر لتطبيق (${appName}):`, currentPass);
            if (newPass === null) return;
            if (!newPass.trim()) {
                alert('كلمة السر لا يمكن أن تكون فارغة!');
                return;
            }

            const docRef = db.collection('members').doc(mId);
            const doc = await docRef.get();
            if (!doc.exists) return;

            let entries = doc.data().entries || [];
            entries[entIndex].pass = newPass.trim();
            entries[entIndex].date = new Date().toISOString().split('T')[0];

            await docRef.update({ entries });
            renderAdminView();
        }

        async function adminEditMemberPassword(mId, username, currentPass) {
            const newPass = prompt(`تعديل كلمة المرور الخاصة بالحساب (${username}):`, currentPass);
            if (newPass === null) return;

            if (!newPass.trim()) {
                alert('كلمة المرور لا يمكن أن تكون فارغة!');
                return;
            }

            await db.collection('members').doc(mId).update({
                password: newPass.trim()
            });

            renderAdminView();
        }

        async function adminDeleteMember(mId) {
            if (!confirm('حذف هذا المستخدم نهائياً؟')) return;
            expandedMembers.delete(mId);
            await db.collection('members').doc(mId).delete();
            renderAdminView();
        }

        function copyPassword(text) {
            navigator.clipboard.writeText(text);
            alert('تم نسخ كلمة المرور بنجاح!');
        }

        function logout() {
            if (autoSyncInterval) clearInterval(autoSyncInterval);
            expandedMembers.clear();
            currentUser = null;
            currentMemberDocId = null;
            toggleView('loginSection');
        }
    </script>
</body>
</html>
