<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خزنة العائلة - FamilyVault</title>
  <!-- استيراد خط تجوال لتصميم عصري ومريح -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      direction: rtl;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 {
      color: #4f46e5;
      font-size: 24px;
    }
    .btn-refresh {
      background: #4f46e5;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-refresh:hover {
      background: #4338ca;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-submit {
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }
    .btn-submit:hover {
      background: #059669;
    }
    .vault-list {
      margin-top: 30px;
    }
    .vault-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .vault-info h3 {
      font-size: 16px;
      color: #111827;
      margin-bottom: 4px;
    }
    .vault-info p {
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🔐 خزنة العائلة (FamilyVault)</h1>
      <!-- زر التحديث الفوري المضاف حديثاً -->
      <button id="refreshBtn" class="btn-refresh" onclick="loadVaultData()">
        🔄 تحديث البيانات
      </button>
    </header>

    <!-- نموذج إضافة كلمة مرور أو ملاحظة جديدة -->
    <div class="form-group">
      <label for="itemTitle">عنوان الحساب / الخدمة:</label>
      <input type="text" id="itemTitle" placeholder="مثال: راوتر البيت، حساب Netflix...">
    </div>
    <div class="form-group">
      <label for="itemData">كلمة المرور أو التفاصيل:</label>
      <input type="text" id="itemData" placeholder="اكتب كلمة المرور هنا...">
    </div>
    <button class="btn-submit" onclick="saveVaultItem()">حفظ في السحابة ☁️</button>

    <!-- قائمة عرض البيانات المخزنة -->
    <div class="vault-list">
      <h3 style="margin-bottom: 15px; font-size: 18px;">البيانات المحفوظة سحابياً:</h3>
      <div id="itemsContainer">
        <p style="color: #6b7280; text-align: center;">جاري تحميل البيانات...</p>
      </div>
    </div>
  </div>

  <!-- ربط مكتبات Firebase (SDK v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات مشروعك في Firebase (FamilyVault)
    const firebaseConfig = {
      apiKey: "AIzaSy... (أدخل مفتاحك هنا إن لم يكن مضافاً)",
      authDomain: "familyvault-8246c.firebaseapp.com",
      projectId: "familyvault-8246c",
      storageBucket: "familyvault-8246c.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase و Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // جعل الدوال متاحة على مستوى النطاق العام (Global) لتعمل مع الأزرار
    window.saveVaultItem = async function() {
      const title = document.getElementById('itemTitle').value.trim();
      const data = document.getElementById('itemData').value.trim();

      if (!title || !data) {
        alert("الرجاء إدخال العنوان وكلمة المرور!");
        return;
      }

      try {
        await addDoc(collection(db, "vaultItems"), {
          title: title,
          data: data,
          createdAt: new Date()
        });
        
        document.getElementById('itemTitle').value = '';
        document.getElementById('itemData').value = '';
        alert("تم الحفظ بنجاح وسزامن مع باقي أجهزة العائلة!");
        loadVaultData(); // تحديث القائمة فوراً بعد الحفظ
      } catch (e) {
        console.error("خطأ أثناء الحفظ: ", e);
        alert("حدث خطأ أثناء الحفظ، تأكد من الاتصال.");
      }
    };

    window.loadVaultData = async function() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '<p style="color: #6b7280; text-align: center;">جاري تحديث البيانات...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "vaultItems"));
        container.innerHTML = '';
        
        if (querySnapshot.empty) {
          container.innerHTML = '<p style="color: #6b7280; text-align: center;">لا توجد بيانات محفوظة حتى الآن.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const item = doc.data();
          container.innerHTML += `
            <div class="vault-card">
              <div class="vault-info">
                <h3>${item.title}</h3>
                <p>كلمة المرور: <strong>${item.data}</strong></p>
              </div>
            </div>
          `;
        });
      } catch (e) {
        console.error("خطأ في جلب البيانات: ", e);
        container.innerHTML = '<p style="color: #ef4444; text-align: center;">فشل تحميل البيانات، اضغط زر التحديث لإعادة المحاولة.</p>';
      }
    };

    // جلب البيانات تلقائياً أول ما يفتح المستخدم الصفحة
    loadVaultData();
  </script>

</body>
</html>
