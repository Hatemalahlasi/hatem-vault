<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خزنة العائلة السحابية | Family Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- استدعاء مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-page: #f0f7ff;
            --bg-card: #ffffff;
            --primary-blue: #0284c7;
            --light-blue: #e0f2fe;
            --hover-blue: #0369a1;
            --border-color: #bae6fd;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --success: #059669;
            --warning-bg: #fef3c7;
            --warning: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, rgba(186, 230, 253, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 242, 254, 0.6) 0px, transparent 50%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1);
        }

        @media (min-width: 768px) {
            .container {
                padding: 28px;
                border-radius: 20px;
            }
        }

        .login-box { max-width: 380px; margin: 0 auto; width: 100%; }

        .system-icon {
            width: 58px;
            height: 58px;
            background: var(--light-blue);
            color: var(--primary-blue);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 24px;
        }

        h2 { text-align: center; font-size: 19px; font-weight: 800; margin-bottom: 4px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 700; }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 9px;
            color: var(--text-dark);
            font-family: 'Cairo', sans-serif;
            font-size: 13.5px;
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 9px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary-blue); color: #ffffff; }
        .btn-primary:hover { background: var(--hover-blue); }

        .btn-outline { background: var(--light-blue); color: var(--primary-blue); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #bae6fd; }

        .btn-warning { background: var(--warning-bg); color: var(--warning); }
        .btn-warning:hover { background: var(--warning); color: #ffffff; }

        .btn-danger { background: var(--danger-bg); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #ffffff; }

        .btn-sm { padding: 6px 10px; font-size: 12px; width: auto; border-radius: 7px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid var(--light-blue);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .top-bar-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .admin-badge {
            background: var(--light-blue);
            color: var(--primary-blue);
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }

        .panel-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .grid-3 { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 8px; }

        @media (min-width: 640px) {
            .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
            .grid-2 { grid-template-columns: 1fr 1fr; }
        }

        .table-wrapper { overflow-x: auto; border-radius: 10px; border: 1px solid #e2e8f0; -webkit-overflow-scrolling: touch; }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            background: #ffffff;
            white-space: nowrap;
        }

        .data-table th {
            background: var(--light-blue);
            color: var(--text-dark);
            font-weight: 800;
            text-align: right;
            padding: 9px 11px;
        }

        .data-table td {
            padding: 9px 11px;
            border-top: 1px solid #f1f5f9;
        }

        .pass-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 2px 6px;
            border-radius: 5px;
        }

        .pass-badge {
            font-family: 'JetBrains Mono', monospace;
            color: #0369a1;
            font-weight: 700;
            direction: ltr;
            font-size: 12px;
        }

        .btn-copy-pass {
            background: transparent;
            border: none;
            color: var(--primary-blue);
            cursor: pointer;
            font-size: 12px;
        }

        .member-block {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شاشة تسجيل الدخول -->
        <div id="loginSection" class="login-box">
            <div class="system-icon"><i class="fa-solid fa-cloud-lock"></i></div>
            <h2>خزنة العائلة السحابية</h2>
            <p class="subtitle">مزامنة فورية وتلقائية لأجهزة العائلة</p>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary" onclick="login()" style="margin-top: 6px;">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
            </button>
        </div>

        <!-- لوحة المستخدم -->
        <div id="userDashboard" class="hidden">
            <div class="top-bar">
                <div>
                    <span class="admin-badge"><i class="fa-solid fa-user-check"></i> حساب شخصي سحابي</span>
                    <h3 style="margin-top: 3px; font-size: 17px;" id="welcomeUserTitle">أهلاً بك</h3>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-outline btn-sm" onclick="refreshUserDataManual()">
                        <i class="fa-solid fa-rotate"></i> تحديث
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="changeMyPassword()">
                        <i class="fa-solid fa-key"></i> الباسورد
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i> خروج
                    </button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title"><i class="fa-solid fa-circle-plus"></i> إضافة تطبيق أو حساب جديد</div>
                <div class="grid-3">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم التطبيق</label>
                        <input type="text" id="appName" placeholder="مثال: انستقرام">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>كلمة السر</label>
                        <input type="text" id="appPass" placeholder="كلمة السر الجديدة">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>تاريخ التغيير</label>
                        <input type="date" id="appDate">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addUserEntry()" style="margin-top: 10px;">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ في السحابة
                </button>
            </div>

            <h4 style="font-size: 13.5px; margin-bottom: 6px;">حساباتك المسجلة:</h4>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>التطبيق</th>
                            <th>كلمة السر</th>
                            <th>تاريخ التغيير</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="userEntriesTable"></tbody>
                </table>
            </div>
        </div>

        <!-- لوحة المشرف -->
        <div id="adminDashboard" class="hidden">
            <div class="top-bar">
                <div>
                    <span class="admin-badge"><i class="fa-solid fa-crown"></i> المشرف العام (مزامنة سحابية)</span>
                    <h3 style="margin-top: 3px; font-size: 17px;">إدارة العائلة</h3>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-outline btn-sm" onclick="renderAdminView()">
                        <i class="fa-solid fa-rotate"></i> تحديث
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="changeAdminPassword()">
                        <i class="fa-solid fa-key"></i> الباسورد
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="fa-solid fa-power-off"></i> خروج
                    </button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title"><i class="fa-solid fa-user-plus"></i> إضافة فرد جديد للعائلة</div>
                <div class="grid-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم المستخدم</label>
                        <input type="text" id="newMemberUser" placeholder="مثال: أحمد">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>كلمة المرور</label>
                        <input type="text" id="newMemberPass" placeholder="مثال: 2026">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="adminCreateMember()" style="margin-top: 10px;">
                    <i class="fa-solid fa-check"></i> إضافة الفرد سحابياً
                </button>
            </div>

            <h4 style="font-size: 14px; margin-bottom: 8px;">أفراد العائلة المسجلون (<span id="membersCount">0</span>):</h4>
            <div id="adminAllDataContainer"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3dZmGf-HiIleBURpFj-kpssabUuOpRD4",
            authDomain: "familyvault-8246c.firebaseapp.com",
            projectId: "familyvault-8246c",
            storageBucket: "familyvault-8246c.firebasestorage.app",
            messagingSenderId: "175087357500",
            appId: "1:175087357500:web:05c7cbc434c86b2c04fd39",
            measurementId: "G-XN5SPDD0SX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const ADMIN_USER = "hatem";
        let currentUser = null;
        let currentMemberDocId = null;
        let autoSyncInterval = null;

        document.getElementById('appDate').valueAsDate = new Date();

        function toggleView(viewId) {
            ['loginSection', 'userDashboard', 'adminDashboard'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function getAdminPass() {
            const doc = await db.collection('settings').doc('admin').get();
            if (doc.exists) {
                return doc.data().password;
            } else {
                await db.collection('settings').doc('admin').set({ password: "12345" });
                return "12345";
            }
        }

        async function login() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            if (!u || !p) {
                alert('يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            const adminPass = await getAdminPass();
            if (u === ADMIN_USER && p === adminPass) {
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                renderAdminView();
                toggleView('adminDashboard');
                startAutoSync('admin');
                return;
            }

            const snapshot = await db.collection('members').where('username', '==', u).where('password', '==', p).get();
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                currentUser = u;
                currentMemberDocId = doc.id;
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('welcomeUserTitle').innerText = `أهلاً بك، ${u}`;
                renderUserEntries(doc.data().entries || []);
                toggleView('userDashboard');
                startAutoSync('user');
            } else {
                alert('خطأ في اسم المستخدم أو كلمة المرور!');
            }
        }

        function startAutoSync(role) {
            if (autoSyncInterval) clearInterval(autoSyncInterval);
            autoSyncInterval = setInterval(async () => {
                if (role === 'user' && currentMemberDocId) {
                    const doc = await db.collection('members').doc(currentMemberDocId).get();
                    if (doc.exists) {
                        renderUserEntries(doc.data().entries || []);
                    }
                } else if (role === 'admin') {
                    renderAdminView();
                }
            }, 5000);
        }

        async function refreshUserDataManual() {
            if (!currentMemberDocId) return;
            const doc = await db.collection('members').doc(currentMemberDocId).get();
            if (doc.exists) {
                renderUserEntries(doc.data().entries || []);
            }
        }

        async function changeMyPassword() {
            const currentPass = prompt('أدخل كلمة المرور الحالية لحسابك:');
            if (currentPass === null) return;
            
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            if (!doc.exists) return;

            if (doc.data().password !== currentPass) {
                alert('كلمة المرور الحالية غير صحيحة!');
                return;
            }

            const newPass = prompt('أدخل كلمة المرور الجديدة:');
            if (!newPass || !newPass.trim()) return;

            await memberRef.update({ password: newPass.trim() });
            alert('تم تغيير كلمة المرور وحفظها في السحابة بنجاح!');
        }

        async function changeAdminPassword() {
            const oldPass = prompt('أدخل كلمة مرور المشرف الحالية:');
            if (oldPass === null) return;
            const adminPass = await getAdminPass();
            if (oldPass !== adminPass) {
                alert('كلمة المرور الحالية غير صحيحة!');
                return;
            }
            const newPass = prompt('أدخل كلمة مرور المشرف الجديدة:');
            if (!newPass || !newPass.trim()) return;

            await db.collection('settings').doc('admin').set({ password: newPass.trim() });
            alert('تم تغيير كلمة مرور المشرف بنجاح!');
        }

        async function addUserEntry() {
            const app = document.getElementById('appName').value.trim();
            const pass = document.getElementById('appPass').value.trim();
            const date = document.getElementById('appDate').value;

            if (!app || !pass || !date) {
                alert('يرجى تعبئة الحقول وتحديد التاريخ');
                return;
            }

            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            entries.push({ app, pass, date });

            await memberRef.update({ entries });
            document.getElementById('appName').value = '';
            document.getElementById('appPass').value = '';
            document.getElementById('appDate').valueAsDate = new Date();
            renderUserEntries(entries);
        }

        function renderUserEntries(entries) {
            const tbody = document.getElementById('userEntriesTable');
            tbody.innerHTML = '';
            if (entries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">لا توجد حسابات محفوظة.</td></tr>';
                return;
            }
            entries.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.app}</strong></td>
                        <td>
                            <div class="pass-container">
                                <span class="pass-badge">${item.pass}</span>
                                <button class="btn-copy-pass" onclick="copyPassword('${item.pass}')"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </td>
                        <td>${item.date}</td>
                        <td>
                            <div style="display: flex; gap: 4px;">
                                <button class="btn btn-warning btn-sm" onclick="editUserEntry(${index})" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUserEntry(${index})" title="حذف"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        async function editUserEntry(index) {
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            const item = entries[index];

            const newPass = prompt(`تعديل كلمة السر لـ (${item.app}):`, item.pass);
            if (newPass === null) return;

            const newDate = prompt(`تعديل تاريخ التغيير (YYYY-MM-DD):`, item.date);
            if (newDate === null) return;

            if (!newPass.trim() || !newDate.trim()) {
                alert('لا يمكن ترك الحقول فارغة!');
                return;
            }

            entries[index].pass = newPass.trim();
            entries[index].date = newDate.trim();

            await memberRef.update({ entries });
            renderUserEntries(entries);
        }

        async function deleteUserEntry(index) {
            if (!confirm('حذف هذا الحساب؟')) return;
            const memberRef = db.collection('members').doc(currentMemberDocId);
            const doc = await memberRef.get();
            let entries = doc.data().entries || [];
            entries.splice(index, 1);
            await memberRef.update({ entries });
            renderUserEntries(entries);
        }

        async function adminCreateMember() {
            const username = document.getElementById('newMemberUser').value.trim();
            const password = document.getElementById('newMemberPass').value.trim();

            if (!username || !password) {
                alert('أدخل اسم المستخدم وكلمة المرور');
                return;
            }

            await db.collection('members').add({
                username,
                password,
                entries: []
            });

            document.getElementById('newMemberUser').value = '';
            document.getElementById('newMemberPass').value = '';
            renderAdminView();
        }

        async function renderAdminView() {
            const snapshot = await db.collection('members').get();
            document.getElementById('membersCount').innerText = snapshot.size;
            const container = document.getElementById('adminAllDataContainer');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:12px;">لا يوجد أفراد مسجلون.</p>';
                return;
            }

            snapshot.forEach(docSnap => {
                const member = docSnap.data();
                const mId = docSnap.id;
                let entriesHtml = '';
                
                if (!member.entries || member.entries.length === 0) {
                    entriesHtml = '<p style="font-size: 12.5px; color: var(--text-muted); padding: 5px 0;">لا توجد تطبيقات مضافة.</p>';
                } else {
                    entriesHtml = `<div class="table-wrapper" style="margin-top: 5px;"><table class="data-table"><thead><tr><th>التطبيق</th><th>كلمة السر</th><th>التاريخ</th></tr></thead><tbody>`;
                    member.entries.forEach(ent => {
                        entriesHtml += `<tr><td>${ent.app}</td><td><span class="pass-badge">${ent.pass}</span></td><td>${ent.date}</td></tr>`;
                    });
                    entriesHtml += `</tbody></table></div>`;
                }

                container.innerHTML += `
                    <div class="member-block">
                        <div class="member-header">
                            <div>
                                <strong style="color: var(--primary-blue); font-size: 14px;">${member.username}</strong>
                                <span style="font-size: 12px; color: var(--text-muted); margin-right: 6px;">الباسورد: <span class="pass-badge">${member.password}</span></span>
                            </div>
                            <div style="display: flex; gap: 4px;">
                                <button class="btn btn-warning btn-sm" onclick="adminEditMemberPassword('${mId}', '${member.username}', '${member.password}')">تعديل الباسورد</button>
                                <button class="btn btn-danger btn-sm" onclick="adminDeleteMember('${mId}')">حذف</button>
                            </div>
                        </div>
                        ${entriesHtml}
                    </div>
                `;
            });
        }

        async function adminEditMemberPassword(mId, username, currentPass) {
            const newPass = prompt(`تعديل كلمة المرور الخاصة بالعضو (${username}):`, currentPass);
            if (newPass === null) return;

            if (!newPass.trim()) {
                alert('كلمة المرور لا يمكن أن تكون فارغة!');
                return;
            }

            await db.collection('members').doc(mId).update({
                password: newPass.trim()
            });

            renderAdminView();
        }

        async function adminDeleteMember(mId) {
            if (!confirm('حذف هذا الفرد نهائياً؟')) return;
            await db.collection('members').doc(mId).delete();
            renderAdminView();
        }

        function copyPassword(text) {
            navigator.clipboard.writeText(text);
            alert('تم نسخ كلمة المرور!');
        }

        function logout() {
            if (autoSyncInterval) clearInterval(autoSyncInterval);
            currentUser = null;
            currentMemberDocId = null;
            toggleView('loginSection');
        }
    </script>
</body>
</html>
